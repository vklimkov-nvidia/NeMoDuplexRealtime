# EasyMagpie with a semantic backbone token and cumulative acoustic refinement.
defaults:
  - easy_magpietts_lhotse
  - _self_

codecmodel_path: ???
phoneme_tokenizer_path: ???
train_input_cfg: ???
validation_input_cfg: ???

model:
  codecmodel_path: ${codecmodel_path}
  frame_stacking_factor: 1

  # Reconstruct and project all 13 codec latents as the backbone's audio input.
  cond_type: projection
  codebook_dim: 78
  audio_infill_min: 0.25
  audio_infill_max: 1.0
  audio_infill_beta: 2.0

  # The backbone retains its parallel 13-codebook auxiliary head. The cumulative
  # stack below replaces the legacy within-frame local transformer.
  local_transformer_type: none
  val_temp: 1.0

  phoneme_tokenizer:
    tokenizer_path: ${phoneme_tokenizer_path}

  train_ds:
    dataset:
      input_cfg: ${train_input_cfg}

  validation_ds:
    dataset:
      input_cfg: ${validation_input_cfg}

  acoustic_decoder_transformer:
    _target_: nemo.collections.tts.modules.magpietts_modules.AcousticDecoderTransformer
    input_dim: ${model.hidden_dim}
    d_model: ${model.hidden_dim}
    semantic_dim: 6
    num_codebooks: 12
    codebook_size: 4096
    prediction_schedule: [1, 3, 4, 4]
    sampling_temperature: 0.0
    sampling_topk: null

    transformer:
      _target_: nemo.collections.tts.modules.transformer_2501.Transformer
      n_layers: 12
      d_model: ${model.hidden_dim}
      d_ffn: 4096
      sa_n_heads: 12
      kernel_size: 1
      p_dropout: 0.1
      p_dropout_out: 0.0
      has_xattn: false
      is_causal: true
      apply_norm_out: true
      max_length_causal_mask: 4096
      use_learnable_pos_emb: true
